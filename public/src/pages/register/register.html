<link rel="stylesheet" href="/src/pages/register/register.css">
<script src="/src/pages/register/register.js"></script>

<form method="POST" action="">
    <h2>Créer un compte</h2>
    <input type="text" name="username" placeholder="username" required>
    <input type="password" name="password" placeholder="password" required>
    <input type="password" name="confirm_password" placeholder="Confirm password" required>
    <input type="number" name="code" placeholder="000000" inputmode="numeric" min="0" max="999999" required>
    <button type="submit"><p>Créer le compte</p></button>
    <p>Vous avez déjà un compte ? <a href="/login">Connectez-vous</a> !</p>
</form>
