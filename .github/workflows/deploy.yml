name: Deploy

on:
  workflow_run:
    workflows: ["CI/CD Security Tests"]
    types:
      - completed

jobs:
  deploy-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Send API Request
        run: |
          curl -f -X GET \
            https://doc.altherneum.fr/api/deploy