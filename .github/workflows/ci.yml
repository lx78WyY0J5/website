name: CI/CD Security Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: mydb
          MARIADB_USER: webuser
          MARIADB_PASSWORD: strongpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP & configure
        run: |
          SKIP_MARIADB=1 bash install.sh
          
          php -v
          php -m | grep pdo_mysql

      - name: Start services (MariaDB + PHP)
        run: |
          SKIP_MARIADB=1 nohup bash start.sh > /tmp/start.log 2>&1 &
          echo $! > /tmp/start-pid.txt
          # Wait for PHP server to be ready
          for i in {1..30}; do
            curl -s http://127.0.0.1:8000/ > /dev/null 2>&1 && echo "PHP server ready" && break
            sleep 1
          done

      - name: Run security tests
        run: bash tests/run-all-tests.sh
        env:
          BASE_URL: http://127.0.0.1:8000

      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/start-pid.txt 2>/dev/null) 2>/dev/null || true
          pkill -f "php -S 127.0.0.1:8000" 2>/dev/null || true