name: CI/CD Security Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: mydb
          MARIADB_USER: webuser
          MARIADB_PASSWORD: strongpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP & configure
        run: |
          SKIP_MARIADB=1 bash install.sh
          
          php -v
          php -m | grep pdo_mysql

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            mysql -h 127.0.0.1 -u root -prootpassword -e "SELECT 1" > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          DB_IP="127.0.0.1"
          DB_USER="webuser"
          DB_PASS="strongpassword"
          DB_NAME="mydb"
          REGISTRATION_CODE="123456"
          FORCE_DB_INIT: "true"
          EOF

      - name: Initialize database
        run: |
          cd public
          php -r '$_SERVER["DOCUMENT_ROOT"] = "."; require "src/php/create-db.php";'

      - name: Start PHP server
        run: |
          cd public
          php -S 127.0.0.1:8000 -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-pid.txt
          sleep 3
          curl -s http://127.0.0.1:8000/ > /dev/null && echo "PHP server ready"

      - name: Run security tests
        run: bash tests/run-all-tests.sh
        env:
          BASE_URL: http://127.0.0.1:8000

      - name: Stop PHP server
        if: always()
        run: |
          kill $(cat /tmp/php-pid.txt 2>/dev/null) 2>/dev/null || true