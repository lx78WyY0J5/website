name: CI/CD Security Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: mydb
          MARIADB_USER: webuser
          MARIADB_PASSWORD: strongpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP & configure
        run: |
          SKIP_MARIADB=1 bash install.sh
          
          php -v
          php -m | grep pdo_mysql

      - name: Start services (MariaDB + PHP)
        run: |
          SKIP_MARIADB=1 bash start.sh
          # start.sh waits for PHP server to be ready, then exits in CI mode
          # PHP server continues running in background

      - name: Run security tests
        run: bash tests/run-all-tests.sh
        env:
          BASE_URL: http://127.0.0.1:8000

      - name: Stop services
        if: always()
        run: |
          pkill -f "php -S 127.0.0.1:8000" 2>/dev/null || true